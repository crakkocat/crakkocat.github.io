<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrakkoCat</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f9fafb;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: white;
  border-bottom: 1px solid #e5e7eb;
}

header img { height: 40px; }

.container {
  display: flex;
  height: calc(100vh - 65px);
}

.sidebar {
  width: 260px;
  background: white;
  border-right: 1px solid #e5e7eb;
  padding: 15px;
  overflow-y: auto;
}

.lesson {
  padding: 10px;
  border-radius: 6px;
  margin-bottom: 5px;
  cursor: pointer;
}

.lesson:hover { background: #f1f5f9; }

.lesson.active { background: #dbeafe; }

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.top {
  padding: 20px;
  background: white;
  border-bottom: 1px solid #e5e7eb;
}

.editor {
  display: flex;
  flex: 1;
}

.panel {
  width: 50%;
  display: flex;
  flex-direction: column;
}

.panel-header {
  padding: 10px;
  background: #f1f5f9;
  border-bottom: 1px solid #e5e7eb;
  font-weight: bold;
}

textarea {
  flex: 1;
  border: none;
  padding: 15px;
  font-family: monospace;
  font-size: 14px;
  outline: none;
}

iframe {
  flex: 1;
  border: none;
  background: white;
}

.controls {
  padding: 10px;
  background: white;
  border-top: 1px solid #e5e7eb;
  display: flex;
  justify-content: space-between;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 6px;
  cursor: pointer;
}

button:hover { background: #1d4ed8; }

.progress {
  height: 6px;
  background: #e5e7eb;
  border-radius: 4px;
  overflow: hidden;
  margin-top: 10px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #22c55e;
}

footer {
  text-align: center;
  padding: 8px;
  font-size: 0.8em;
  color: #6b7280;
}
</style>
</head>
<body>

<header>
  <img src="cose.png" alt="CrakkoCat Logo">
  <strong>CrakkoCat</strong>
</header>

<div class="container">

<div class="sidebar">
  <div class="lesson" onclick="loadLesson(0)">1. HTML Intro</div>
  <div class="lesson" onclick="loadLesson(1)">2. HTML Challenge</div>
  <div class="lesson" onclick="loadLesson(2)">3. CSS Intro</div>
  <div class="lesson" onclick="loadLesson(3)">4. JavaScript Intro</div>
</div>

<div class="main">

<div class="top" id="lessonText">
  <h2>Welcome</h2>
  <p>Select a lesson to start learning.</p>
  <div class="progress"><div class="progress-bar" id="progress"></div></div>
</div>

<div class="editor">

<div class="panel">
  <div class="panel-header">Code</div>
  <textarea id="editor"></textarea>
</div>

<div class="panel">
  <div class="panel-header">Output</div>
  <iframe id="output"></iframe>
</div>

</div>

<div class="controls">
  <button onclick="runCode()">Run</button>
  <button onclick="nextLesson()">Next Lesson →</button>
</div>

</div>

</div>

<footer>© 2026 CrakkoCat</footer>

<script>
const lessons = [
  {
    title: "HTML Intro",
    text: "Create a heading.",
    code: "<h1>Hello World</h1>"
  },
  {
    title: "HTML Challenge",
    text: "Add a paragraph under the heading.",
    code: "<h1>Hello</h1>"
  },
  {
    title: "CSS Intro",
    text: "Change background color.",
    code: "<style>body{background:lightblue}</style>"
  },
  {
    title: "JavaScript Intro",
    text: "Make a button alert.",
    code: "<button onclick=\"alert('Hi')\">Click</button>"
  }
];

let current = 0;

function loadLesson(i) {
  current = i;
  document.getElementById('lessonText').innerHTML =
    `<h2>${lessons[i].title}</h2><p>${lessons[i].text}</p><div class="progress"><div class="progress-bar" style="width:${(i/lessons.length)*100}%"></div></div>`;

  document.getElementById('editor').value = lessons[i].code;
}

function runCode() {
  const code = document.getElementById('editor').value;
  document.getElementById('output').srcdoc = code;
}

function nextLesson() {
  if (current < lessons.length - 1) {
    loadLesson(current + 1);
  }
}

loadLesson(0);
</script>

</body>
</html>
