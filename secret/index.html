<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CrakkoCat Game 🐱</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #1a1a2e;
        color: white;
        font-family: Arial;
        text-align: center;
    }

    canvas {
        background: #16213e;
        display: block;
        margin: auto;
    }

    #score {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 20px;
    }
</style>
</head>
<body>

<div id="score">Score: 0</div>
<canvas id="gameCanvas" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let score = 0;

// Player (CrakkoCat 🐱)
const player = {
    x: 100,
    y: 100,
    size: 40,
    speed: 4
};

// Collectible
let star = {
    x: Math.random() * 760,
    y: Math.random() * 460,
    size: 20
};

// Controls
let keys = {};

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

// Draw Cat (orange + white hoodie)
function drawPlayer() {
    // Body (hoodie)
    ctx.fillStyle = "white";
    ctx.fillRect(player.x, player.y, player.size, player.size);

    // Head (orange)
    ctx.fillStyle = "orange";
    ctx.beginPath();
    ctx.arc(player.x + 20, player.y + 15, 15, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = "black";
    ctx.fillRect(player.x + 12, player.y + 10, 4, 4);
    ctx.fillRect(player.x + 24, player.y + 10, 4, 4);
}

// Draw Star
function drawStar() {
    ctx.fillStyle = "yellow";
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
}

// Movement
function movePlayer() {
    if (keys["ArrowUp"] || keys["w"]) player.y -= player.speed;
    if (keys["ArrowDown"] || keys["s"]) player.y += player.speed;
    if (keys["ArrowLeft"] || keys["a"]) player.x -= player.speed;
    if (keys["ArrowRight"] || keys["d"]) player.x += player.speed;

    // Boundaries
    player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));
}

// Collision
function checkCollision() {
    let dx = player.x + 20 - star.x;
    let dy = player.y + 20 - star.y;
    let distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < 30) {
        score++;
        document.getElementById("score").innerText = "Score: " + score;

        star.x = Math.random() * 760;
        star.y = Math.random() * 460;
    }
}

// Game Loop
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    movePlayer();
    checkCollision();

    drawPlayer();
    drawStar();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
