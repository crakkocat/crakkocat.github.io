<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invite CatBot</title>


    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            max-width: 400px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        p {
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            background-color: #5865F2;
            color: white;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #4752c4;
        }

        .small {
            margin-top: 15px;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🐱 Invite CatBot</h1>
    <p>Add CatBot to your Discord server in just one click.</p>

    <!-- Replace YOUR_CLIENT_ID -->
    <a class="btn" href="https://discord.com/oauth2/authorize?client_id=1486475062801334364">
        Invite Now
    </a>

    <div class="small">
        Redirecting automatically...
    </div>
</div>

</body>
</html>
