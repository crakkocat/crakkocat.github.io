<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Miku Chat</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Phone */
.phone {
    width: 380px;
    height: 650px;
    background: #1e293b;
    border-radius: 25px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* Header */
.header {
    background: #0ea5a4;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.avatar {
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background: url("https://www.crakkocat.com/miku.jpeg") center/cover;
}

.name { font-weight: bold; color: white; }
.status { font-size: 12px; opacity: 0.8; }

/* Chat */
.chat {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.row { display: flex; }
.row.user { justify-content: flex-end; }
.row.miku { justify-content: flex-start; }

.bubble {
    padding: 10px 14px;
    border-radius: 18px;
    max-width: 70%;
    font-size: 14px;
}

.user .bubble {
    background: #0ea5a4;
    border-bottom-right-radius: 5px;
}

.miku .bubble {
    background: #374151;
    border-bottom-left-radius: 5px;
}

.time {
    font-size: 10px;
    opacity: 0.6;
    margin-top: 3px;
}

/* Typing dots */
.dots span {
    animation: blink 1.4s infinite;
}
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
    0%, 80%, 100% { opacity: 0; }
    40% { opacity: 1; }
}

/* Input */
.input-area {
    display: flex;
    padding: 8px;
    background: #0f172a;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: none;
    background: #1e293b;
    color: white;
}

button {
    margin-left: 8px;
    padding: 10px 15px;
    border-radius: 20px;
    border: none;
    background: #0ea5a4;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="phone">
    <div class="header">
        <div class="avatar"></div>
        <div>
            <div class="name">Hatsune Miku</div>
            <div class="status">● Online</div>
        </div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-area">
        <input id="input" placeholder="Message Miku..." />
        <button onclick="send()">Send</button>
    </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");

let memory = {
    name: null,
    mood: "happy"
};

function time() {
    const d = new Date();
    return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
}

function addMessage(text, sender, typing=false) {
    const row = document.createElement("div");
    row.className = "row " + sender;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (typing) {
        bubble.innerHTML = '<div class="dots"><span>.</span><span>.</span><span>.</span></div>';
    } else {
        bubble.textContent = text;

        const t = document.createElement("div");
        t.className = "time";
        t.textContent = time();
        bubble.appendChild(t);
    }

    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;

    return row;
}

/* 🧠 Fake AI logic */
function generateReply(msg) {
    msg = msg.toLowerCase();

    if (msg.includes("my name is")) {
        memory.name = msg.split("my name is")[1].trim();
        return "Your name is " + memory.name + "? That’s so cute! ♪";
    }

    if (msg.includes("hello") || msg.includes("hi")) {
        return "Hi hi~! 💙";
    }

    if (msg.includes("music") || msg.includes("song")) {
        return "Music is my favorite thing ever! 🎤 Want to make a song together?";
    }

    if (msg.includes("sad")) {
        memory.mood = "soft";
        return "Aww... I’ll sing something to cheer you up, okay? ♪";
    }

    if (msg.includes("love")) {
        return "Ehehe~ love makes songs even better 💙";
    }

    if (msg.includes("bye")) {
        return "Bye bye~ come back soon! ♪";
    }

    const random = [
        "Ehehe~ tell me more!",
        "That sounds interesting ♪",
        "La la la~ 🎤",
        "You’re fun to talk to!",
        "Hmm~ I wonder...",
        "Let’s keep chatting! 💙"
    ];

    return random[Math.floor(Math.random() * random.length)];
}

function send() {
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    const typing = addMessage("", "miku", true);

    setTimeout(() => {
        typing.remove();
        const reply = generateReply(text);
        addMessage(reply, "miku");
    }, 800 + Math.random() * 1200);
}

input.addEventListener("keypress", e => {
    if (e.key === "Enter") send();
});

/* Intro */
setTimeout(() => {
    addMessage("Hi! I’m Miku! Let’s chat~ 🎶", "miku");
}, 500);
</script>

</body>
</html>
